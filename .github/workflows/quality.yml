name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check file size
        run: python3 assets/project-kit/scripts/check_file_lines.py
      - name: Check Python complexity and module dependencies
        run: python3 assets/project-kit/scripts/check_python_design.py
      - name: Test initializer
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test project gates and deliberate violations
        run: python3 -m unittest discover -s assets/project-kit/tests -p 'test_*.py' -v
      - name: Check whitespace
        run: git show --check --format= HEAD
